name: Tests

on:
  push:
    paths:
      - 'agents/**'
      - 'hooks/**'
      - 'skills/**/*.sh'
      - 'install.sh'
      - 'tests/**'
  pull_request:
    paths:
      - 'agents/**'
      - 'hooks/**'
      - 'skills/**/*.sh'
      - 'install.sh'
      - 'tests/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: bash tests/run.sh
